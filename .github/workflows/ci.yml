name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install segdiag
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=segdiag --cov-report=term-missing --cov-fail-under=80

  lint:
    name: ruff + black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install segdiag
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: black --check
        run: black --check --line-length=100 src tests

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install segdiag
        run: pip install -e ".[dev]"
      - name: mypy
        run: mypy src/segdiag
